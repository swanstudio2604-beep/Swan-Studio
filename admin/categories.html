<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Collections & Categories — Swan Studio Admin</title>
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Google Fonts: Cormorant Garamond & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css?v=m2">
</head>
<body>

  <!-- Admin Application Wrapper -->
  <div class="admin-container" id="admin-app" style="display: none;">
    
    <!-- Sidebar Mount (Injected by admin-shared.js) -->
    <div id="admin-sidebar-mount"></div>

    <!-- Main Workspace -->
    <main class="admin-main">
      <div class="admin-header-row">
        <div>
          <h1 class="admin-page-title">Collections & Categories</h1>
          <p class="admin-page-subtitle">Organize your crochet creations into collections that shoppers browse.</p>
        </div>
        <button id="btn-add-category" class="btn btn-primary btn-sm">
          ➕ Add Collection
        </button>
      </div>

      <!-- Categories Table Card (Stacked Cards on Phone) -->
      <div class="admin-card">
        <table class="admin-table admin-responsive-cards">
          <thead>
            <tr>
              <th>Icon</th>
              <th>Collection Name</th>
              <th>URL Slug</th>
              <th>Description</th>
              <th>Sort Order</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="categories-table-body">
            <tr>
              <td colspan="6" style="text-align: center; padding: 2rem;">Loading collections...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Footer Mount -->
      <div id="admin-footer-mount"></div>
    </main>

  </div>

  <!-- Category Modal (Add / Edit) -->
  <div id="category-modal" class="modal-overlay" style="display: none;">
    <div class="modal-dialog" style="max-width: 520px;">
      <div class="modal-header">
        <h2 id="modal-title" style="font-size: 1.5rem;">Add Collection</h2>
        <button class="modal-close-btn" id="modal-close-btn">&times;</button>
      </div>

      <form id="category-form">
        <input type="hidden" id="cat-id">

        <div style="display: grid; grid-template-columns: 1fr 100px; gap: 1rem;">
          <div class="form-group">
            <label for="cat-name" class="form-label">Collection Name <span style="color: var(--rose);">*</span></label>
            <input type="text" id="cat-name" class="form-control" placeholder="e.g. Floral Bouquets" required>
          </div>

          <div class="form-group">
            <label for="cat-icon" class="form-label">Icon Emoji</label>
            <input type="text" id="cat-icon" class="form-control" placeholder="🌸" value="🌸">
          </div>
        </div>

        <div class="form-group">
          <label for="cat-slug" class="form-label">URL Slug <span style="color: var(--rose);">*</span></label>
          <input type="text" id="cat-slug" class="form-control" placeholder="e.g. bouquets" required>
        </div>

        <div class="form-group">
          <label for="cat-desc" class="form-label">Description</label>
          <textarea id="cat-desc" class="form-control" style="min-height: 80px;" placeholder="Brief subtitle explaining this collection..."></textarea>
        </div>

        <div class="form-group">
          <label for="cat-sort" class="form-label">Display Sort Order</label>
          <input type="number" id="cat-sort" class="form-control" value="1" min="1">
        </div>

        <div id="modal-feedback" style="display: none; padding: 0.75rem; border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: 0.85rem;"></div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
          <button type="button" class="btn btn-secondary btn-sm" id="modal-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm" id="modal-save-btn">Save Collection</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/products-demo.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/admin-shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Initialize Admin Layout
      const authorized = await ADMIN.init('categories');
      if (!authorized) return;

      const tableBody = document.getElementById('categories-table-body');
      const addBtn = document.getElementById('btn-add-category');
      const modal = document.getElementById('category-modal');
      const modalTitle = document.getElementById('modal-title');
      const form = document.getElementById('category-form');
      const modalClose = document.getElementById('modal-close-btn');
      const modalCancel = document.getElementById('modal-cancel-btn');
      const feedback = document.getElementById('modal-feedback');
      const nameInput = document.getElementById('cat-name');
      const slugInput = document.getElementById('cat-slug');

      let categories = [];

      nameInput.addEventListener('input', () => {
        if (!document.getElementById('cat-id').value) {
          slugInput.value = nameInput.value
            .toLowerCase()
            .trim()
            .replace(/[^\w\s-]/g, '')
            .replace(/[\s_-]+/g, '-')
            .replace(/^-+|-+$/g, '');
        }
      });

      async function refreshTable() {
        categories = await ADMIN.getCategories();
        renderTable();
      }

      function renderTable() {
        if (categories.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 2rem;">No collections found.</td></tr>`;
          return;
        }

        tableBody.innerHTML = categories.map(c => `
          <tr>
            <td style="font-size: 1.5rem; text-align: center; width: 60px;">${c.icon_emoji || '🧶'}</td>
            <td><strong>${c.name}</strong></td>
            <td><code>${c.slug}</code></td>
            <td style="color: #73615A; max-width: 280px;">${c.description || '—'}</td>
            <td>${c.sort_order || 1}</td>
            <td style="text-align: right;">
              <div style="display: flex; gap: 0.45rem; justify-content: flex-end; flex-wrap: wrap;">
                <button type="button" class="btn btn-secondary btn-sm btn-edit" data-id="${c.id}" style="min-height: 44px; padding: 0.45rem 0.85rem;">✏️ Edit</button>
                <button type="button" class="btn btn-secondary btn-sm btn-delete-cat" data-id="${c.id}" style="min-height: 44px; padding: 0.45rem 0.85rem; color: #DC2626; border-color: #FCA5A5;">🗑️ Delete</button>
              </div>
            </td>
          </tr>
        `).join('');

        document.querySelectorAll('.btn-edit').forEach(btn => {
          btn.addEventListener('click', () => {
            const cat = categories.find(c => c.id === btn.dataset.id);
            if (!cat) return;
            openModal(true);
            document.getElementById('cat-id').value = cat.id;
            document.getElementById('cat-name').value = cat.name;
            document.getElementById('cat-slug').value = cat.slug;
            document.getElementById('cat-desc').value = cat.description || '';
            document.getElementById('cat-icon').value = cat.icon_emoji || '🌸';
            document.getElementById('cat-sort').value = cat.sort_order || 1;
          });
        });

        document.querySelectorAll('.btn-delete-cat').forEach(btn => {
          btn.addEventListener('click', async () => {
            const catId = btn.dataset.id;
            const cat = categories.find(c => String(c.id) === String(catId));
            const name = cat ? cat.name : 'this collection';

            const confirmed = await ADMIN.confirmDialog({
              title: 'Delete Collection?',
              message: `Permanently delete collection "${name}"? Products under this collection will remain safe in inventory.`,
              confirmText: '🗑️ Delete Collection',
              danger: true
            });

            if (!confirmed) return;

            const origText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Deleting...';

            try {
              await ADMIN.deleteCategory(catId);
              ADMIN.showToast(`✓ Collection "${name}" was permanently deleted.`);
              await refreshTable();
            } catch (err) {
              console.error('Error deleting collection:', err);
              ADMIN.showToast(`Failed to delete collection: ${err.message || 'Unknown error'}`, 'danger');
            } finally {
              btn.disabled = false;
              btn.textContent = origText;
            }
          });
        });
      }

      function openModal(isEdit = false) {
        modal.style.display = 'flex';
        feedback.style.display = 'none';
        modalTitle.textContent = isEdit ? 'Edit Collection' : 'Add Collection';
      }

      function closeModal() {
        modal.style.display = 'none';
        form.reset();
        document.getElementById('cat-id').value = '';
      }

      addBtn.addEventListener('click', () => openModal(false));
      modalClose.addEventListener('click', closeModal);
      modalCancel.addEventListener('click', closeModal);

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        feedback.style.display = 'none';

        const id = document.getElementById('cat-id').value;
        const name = document.getElementById('cat-name').value.trim();
        const slug = document.getElementById('cat-slug').value.trim();
        const desc = document.getElementById('cat-desc').value.trim();
        const icon = document.getElementById('cat-icon').value.trim();
        const sort = parseInt(document.getElementById('cat-sort').value, 10);

        try {
          await ADMIN.saveCategory({
            id: id || null,
            name,
            slug,
            description: desc,
            icon_emoji: icon,
            sort_order: sort
          });
          closeModal();
          await refreshTable();
        } catch (err) {
          feedback.style.display = 'block';
          feedback.style.background = '#FEE2E2';
          feedback.style.color = '#991B1B';
          feedback.textContent = err.message || 'Failed to save collection.';
        }
      });

      await refreshTable();
    });
  </script>
</body>
</html>
