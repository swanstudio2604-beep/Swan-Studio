<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory & Stock Management — Swan Studio Admin</title>
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Google Fonts: Cormorant Garamond & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css?v=m1">
</head>
<body>

  <!-- Admin Application Wrapper -->
  <div class="admin-container" id="admin-app" style="display: none;">
    
    <!-- Sidebar Mount (Injected by admin-shared.js) -->
    <div id="admin-sidebar-mount"></div>

    <!-- Main Workspace -->
    <main class="admin-main">
      <div class="admin-header-row">
        <div>
          <h1 class="admin-page-title">Inventory Management</h1>
          <p class="admin-page-subtitle">Update stock units, toggle made-to-order flags, and monitor low-stock alerts.</p>
        </div>
      </div>

      <!-- Inventory Filters Toolbar -->
      <div class="admin-toolbar">
        <input 
          type="search" 
          id="inv-search" 
          class="admin-search-input" 
          placeholder="Filter creation name..."
        >
        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <button id="tab-all" class="category-pill active">All Inventory</button>
          <button id="tab-low" class="category-pill" style="border-color: #F87171; color: #DC2626;">⚠️ Low Stock (&le; 2)</button>
          <button id="tab-made" class="category-pill">Made to Order</button>
          <button id="tab-ready" class="category-pill">Ready to Ship</button>
        </div>
      </div>

      <!-- Inventory Table Card -->
      <div class="admin-card">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Creation</th>
              <th>Category</th>
              <th>Fulfillment Type</th>
              <th>Stock Units</th>
              <th style="text-align: right;">Quick Actions</th>
            </tr>
          </thead>
          <tbody id="inventory-table-body">
            <tr>
              <td colspan="5" style="text-align: center; padding: 2rem;">Loading inventory...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Footer Mount -->
      <div id="admin-footer-mount"></div>
    </main>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/products-demo.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/admin-shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Initialize Admin Layout
      const authorized = await ADMIN.init('inventory');
      if (!authorized) return;

      const tableBody = document.getElementById('inventory-table-body');
      const searchInput = document.getElementById('inv-search');
      const tabAll = document.getElementById('tab-all');
      const tabLow = document.getElementById('tab-low');
      const tabMade = document.getElementById('tab-made');
      const tabReady = document.getElementById('tab-ready');

      let products = [];
      let currentFilter = 'all';

      async function refreshInventory() {
        products = await ADMIN.getProducts();
        renderTable();
      }

      function setActiveTab(activeBtn, filterKey) {
        [tabAll, tabLow, tabMade, tabReady].forEach(b => b.classList.remove('active'));
        activeBtn.classList.add('active');
        currentFilter = filterKey;
        renderTable();
      }

      tabAll.addEventListener('click', () => setActiveTab(tabAll, 'all'));
      tabLow.addEventListener('click', () => setActiveTab(tabLow, 'low'));
      tabMade.addEventListener('click', () => setActiveTab(tabMade, 'made'));
      tabReady.addEventListener('click', () => setActiveTab(tabReady, 'ready'));

      function renderTable() {
        const query = searchInput.value.toLowerCase().trim();

        const filtered = products.filter(p => {
          const matchQuery = !query || p.name.toLowerCase().includes(query);
          
          if (!matchQuery) return false;
          if (currentFilter === 'low') return (p.stock || 0) <= 2;
          if (currentFilter === 'made') return Boolean(p.madeToOrder);
          if (currentFilter === 'ready') return !p.madeToOrder;
          return true;
        });

        if (filtered.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 2rem; color: #8A7670;">No inventory items match this view.</td></tr>`;
          return;
        }

        tableBody.innerHTML = filtered.map(p => {
          const stock = p.stock || 0;
          const isLow = stock <= 2;

          return `
            <tr>
              <td>
                <strong style="color: var(--cocoa); font-size: 0.95rem;">${p.name}</strong>
                <div style="font-size: 0.78rem; color: #8A7670;">Prep: ${p.prepTime || 'N/A'}</div>
              </td>
              <td>${p.categoryName || 'General'}</td>
              <td>
                <button class="btn-action btn-toggle-mto" data-id="${p.id}" data-val="${Boolean(p.madeToOrder)}" title="Click to toggle between Made to Order and Ready to Ship">
                  <span class="badge-status ${p.madeToOrder ? 'badge-made-to-order' : 'badge-ready-to-ship'}">
                    ${p.madeToOrder ? 'Made to Order 🔄' : 'Ready to Ship ⚡'}
                  </span>
                </button>
              </td>
              <td>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                  <button class="btn-action btn-stock-minus" data-id="${p.id}" data-stock="${stock}" style="padding: 0.2rem 0.5rem;">-</button>
                  <input 
                    type="number" 
                    class="input-stock" 
                    data-id="${p.id}" 
                    value="${stock}" 
                    min="0" 
                    style="width: 55px; text-align: center; padding: 0.25rem; border: 1.5px solid ${isLow ? '#F87171' : 'var(--admin-border)'}; border-radius: 4px; font-weight: 600;"
                  >
                  <button class="btn-action btn-stock-plus" data-id="${p.id}" data-stock="${stock}" style="padding: 0.2rem 0.5rem;">+</button>
                  ${isLow ? '<span style="font-size: 0.75rem; color: #DC2626; font-weight: 600;">⚠️ Low</span>' : ''}
                </div>
              </td>
              <td style="text-align: right;">
                <button class="btn-action btn-zero-stock" data-id="${p.id}">
                  🚫 Mark Out of Stock
                </button>
              </td>
            </tr>
          `;
        }).join('');

        // Wire event handlers
        document.querySelectorAll('.btn-stock-minus').forEach(btn => {
          btn.addEventListener('click', async () => {
            const current = parseInt(btn.dataset.stock, 10) || 0;
            if (current > 0) {
              await ADMIN.updateStock(btn.dataset.id, current - 1);
              await refreshInventory();
            }
          });
        });

        document.querySelectorAll('.btn-stock-plus').forEach(btn => {
          btn.addEventListener('click', async () => {
            const current = parseInt(btn.dataset.stock, 10) || 0;
            await ADMIN.updateStock(btn.dataset.id, current + 1);
            await refreshInventory();
          });
        });

        document.querySelectorAll('.input-stock').forEach(input => {
          input.addEventListener('change', async () => {
            const val = parseInt(input.value, 10);
            if (!isNaN(val) && val >= 0) {
              await ADMIN.updateStock(input.dataset.id, val);
              await refreshInventory();
            }
          });
        });

        document.querySelectorAll('.btn-zero-stock').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (confirm('Set stock for this creation to 0?')) {
              await ADMIN.updateStock(btn.dataset.id, 0);
              await refreshInventory();
            }
          });
        });

        document.querySelectorAll('.btn-toggle-mto').forEach(btn => {
          btn.addEventListener('click', async () => {
            const current = btn.dataset.val === 'true';
            await ADMIN.toggleMadeToOrder(btn.dataset.id, current);
            await refreshInventory();
          });
        });
      }

      searchInput.addEventListener('input', renderTable);
      await refreshInventory();
    });
  </script>
</body>
</html>
