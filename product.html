<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — Swan Studio | Handmade Crochet</title>
  <meta name="description" content="Handcrafted crochet creation by Bhumika Nama at Swan Studio. View product details, materials, care instructions, and custom options.">
  <link rel="canonical" href="https://swan-studio.onslate.in/product.html">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="shortcut icon" href="favicon.ico">
  
  <!-- OpenGraph / Social Meta -->
  <meta property="og:type" content="product">
  <meta property="og:url" content="https://swan-studio.onslate.in/product.html">
  <meta property="og:title" content="Product Details — Swan Studio | Handmade Crochet">
  <meta property="og:description" content="Handcrafted crochet creation by Bhumika Nama at Swan Studio. View product details, materials, care instructions, and custom options.">
  <meta property="og:image" content="https://swan-studio.onslate.in/assets/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Handmade Crochet Creation — Swan Studio">
  <meta name="twitter:description" content="Artisanal crochet creations handcrafted with love by Bhumika Nama at Swan Studio.">
  <meta name="twitter:image" content="https://swan-studio.onslate.in/assets/images/og-image.jpg">
  
  <!-- Google Fonts: Cormorant Garamond & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=2.2.3">
</head>
<body>

  <!-- Skip Link for Accessibility -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Global Header (Injected by js/main.js) -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main id="main" class="section section-cream">
    <div class="container">

      <!-- Breadcrumbs -->
      <nav aria-label="Breadcrumbs" style="margin-bottom: var(--space-lg); font-size: 0.88rem; color: #8A7670;">
        <a href="index.html" style="color: var(--cocoa);">Home</a>
        <span style="margin: 0 0.4rem;">/</span>
        <a href="shop.html" style="color: var(--cocoa);">Shop</a>
        <span style="margin: 0 0.4rem;">/</span>
        <span id="breadcrumb-category" style="color: var(--rose-text);">Category</span>
        <span style="margin: 0 0.4rem;">/</span>
        <span id="breadcrumb-title" style="color: #51413C; font-weight: 500;">Product</span>
      </nav>

      <!-- Status banner (visible only if debug param ?demo=true is provided) -->
      <div class="demo-banner" id="product-status-banner" role="status" style="display: none;">
        <span class="demo-banner-icon" id="product-status-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </span>
        <div id="product-status-text"></div>
      </div>

      <!-- Product Detail Main Layout -->
      <div class="product-detail-grid" id="product-details-container">
        <!-- Injected via JavaScript -->
      </div>

      <!-- Customer Reflections Section -->
      <section class="product-reviews-section" id="product-reviews-section" style="margin-top: var(--space-3xl); padding-top: var(--space-2xl); border-top: 1px dashed var(--border-subtle);">
        <div style="text-align: center; max-width: 600px; margin: 0 auto 2rem auto;">
          <span class="hero-tagline-badge" style="margin-bottom: 0.5rem; display: inline-flex; align-items: center; gap: 0.4rem;">
            <span>💌</span> Customer Reflections
          </span>
          <h2 style="font-family: var(--font-serif); font-size: clamp(1.8rem, 3.5vw, 2.4rem); color: var(--cocoa); margin-bottom: 0.4rem;">
            Notes on this creation
          </h2>
          <p style="color: #73615A; font-size: 0.95rem; line-height: 1.5; margin: 0 auto;">
            Unboxing reflections from people who welcomed this handmade piece into their home.
          </p>
        </div>

        <div id="product-reviews-container">
          <div style="text-align: center; padding: 2rem; color: #8A7670;">Loading reflections...</div>
        </div>
      </section>

      <!-- Related Creations Section -->
      <div style="margin-top: var(--space-3xl); padding-top: var(--space-2xl); border-top: 1px dashed var(--border-subtle);">
        <h2 style="font-size: 2rem; margin-bottom: 0.5rem; text-align: center;">You May Also Adore</h2>
        <p style="text-align: center; color: #73615A; font-size: 0.95rem; margin-bottom: var(--space-2xl);">
          Other handcrafted pieces created with the same care and patience.
        </p>

        <div class="products-grid" id="related-products-grid">
          <!-- Injected via JavaScript -->
        </div>
      </div>

    </div>
  </main>

  <!-- Global Footer (Injected by js/main.js) -->
  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=2.2.4"></script>
  <script src="js/api-config.js?v=2.2.4"></script>
  <script src="js/supabase.js?v=2.2.4"></script>
  <script src="js/main.js?v=2.2.4"></script>
  <script src="js/reviews-floating.js?v=2.2.4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('product-details-container');
      const relatedGrid = document.getElementById('related-products-grid');
      const breadcrumbCat = document.getElementById('breadcrumb-category');
      const breadcrumbTitle = document.getElementById('breadcrumb-title');
      const bannerIcon = document.getElementById('product-status-icon');
      const bannerText = document.getElementById('product-status-text');

      try {
        // 1. Read ?slug= from URL
        const urlParams = new URLSearchParams(window.location.search);
        const slug = urlParams.get('slug') || 'daisy-delight-bouquet';

        container.innerHTML = `<p style="text-align: center; padding: 2rem; color: #73615A;">Loading creation details...</p>`;

        const fetchResult = await fetchProductBySlug(slug);
        const product = fetchResult.data;
        const isLive = fetchResult.isLive;

        if (!product) {
          container.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1; text-align: center; padding: 4rem 1.5rem;">
              <div class="empty-state-icon" style="font-size: 3.5rem; margin-bottom: 1rem;">🧶</div>
              <h2 style="font-size: 1.85rem; margin-bottom: 0.5rem; color: var(--cocoa);">Creation Unavailable</h2>
              <p style="color: #73615A; max-width: 500px; margin: 0 auto 1.5rem auto; line-height: 1.6;">
                This handcrafted crochet piece is currently unpublished, out of catalog, or no longer available in our atelier.
              </p>
              <a href="shop.html" class="btn btn-primary">Browse Available Creations</a>
            </div>
          `;
          return;
        }

        // Update banner status (only visible if explicit ?demo=true param)
        const isDemoMode = urlParams.get('demo') === 'true';
        const statusBanner = document.getElementById('product-status-banner');
        if (isDemoMode && statusBanner) {
          statusBanner.style.display = 'flex';
          if (isLive) {
            bannerIcon.textContent = '🟢';
            bannerText.innerHTML = `<strong>Live Database:</strong> Connected to Supabase PostgreSQL. Displaying live catalog item "${product.name}".`;
          } else {
            bannerIcon.textContent = '💡';
            bannerText.innerHTML = `<strong>Demo Catalog:</strong> Displaying local atelier catalog. Connect Supabase in <code>js/supabase.js</code> to stream real-time PostgreSQL updates.`;
          }
        }

        // Update page title & breadcrumbs
        document.title = `${product.name} — Swan Studio | Handmade in Jaipur`;
        if (breadcrumbCat) breadcrumbCat.textContent = product.categoryName || 'Creations';
        if (breadcrumbTitle) breadcrumbTitle.textContent = product.name;

        // Inject Schema.org Product JSON-LD
        try {
          const schemaImg = product.imageUrl
            ? (product.imageUrl.startsWith('http') ? product.imageUrl : `https://swan-studio.onslate.in/${product.imageUrl.replace(/^\//, '')}`)
            : "https://swan-studio.onslate.in/assets/images/hero-bouquet.webp";

          const productSchema = {
            "@context": "https://schema.org/",
            "@type": "Product",
            "name": product.name,
            "image": [schemaImg],
            "description": product.description || "Handcrafted artisanal crochet piece made in Jaipur, India by Bhumika Nama.",
            "sku": `SWAN-${product.slug}`,
            "brand": {
              "@type": "Brand",
              "name": "Swan Studio"
            },
            "offers": {
              "@type": "Offer",
              "url": window.location.href,
              "priceCurrency": "INR",
              "price": product.price,
              "availability": (Boolean(product.isSoldOut || product.sold_out) || ((product.stock !== undefined && product.stock !== null ? Number(product.stock) : 0) <= 0 && !product.madeToOrder)) ? "https://schema.org/OutOfStock" : "https://schema.org/InStock",
              "itemCondition": "https://schema.org/NewCondition"
            }
          };
          const scriptLd = document.createElement('script');
          scriptLd.type = 'application/ld+json';
          scriptLd.textContent = JSON.stringify(productSchema);
          document.head.appendChild(scriptLd);
        } catch (err) {
          console.warn('Schema injection notice:', err);
        }

        // SVG Icon for main visual fallback
        function getMainVisualSvg(type) {
          if (type === 'flower') {
            return `
              <svg viewBox="0 0 160 160" fill="none" style="width: 220px; height: 220px;" aria-hidden="true">
                <circle cx="80" cy="80" r="70" fill="#FFF0F3" stroke="#C78391" stroke-dasharray="4 4" stroke-width="2"/>
                <path d="M80 50 C92 35 108 50 96 66 C112 82 96 98 80 82 C64 98 48 82 64 66 C52 50 68 35 80 50 Z" fill="#E8B7C0" stroke="#C78391" stroke-width="2.5"/>
                <circle cx="80" cy="66" r="8" fill="#FFF8F1" stroke="#51413C" stroke-width="2"/>
                <path d="M80 82 L80 125" stroke="#A9B6A0" stroke-width="5" stroke-linecap="round"/>
                <path d="M80 100 Q100 90 100 105 Q90 110 80 106" fill="#A9B6A0"/>
                <path d="M80 112 Q60 102 60 117 Q70 122 80 118" fill="#A9B6A0"/>
              </svg>
            `;
          } else if (type === 'bag') {
            return `
              <svg viewBox="0 0 160 160" fill="none" style="width: 220px; height: 220px;" aria-hidden="true">
                <rect x="35" y="60" width="90" height="75" rx="10" fill="#F8F3EC" stroke="#C78391" stroke-dasharray="4 4" stroke-width="2"/>
                <path d="M55 60 C55 30 105 30 105 60" stroke="#51413C" stroke-width="4" fill="none"/>
                <rect x="55" y="76" width="50" height="42" rx="4" fill="#E8B7C0" stroke="#C78391" stroke-width="2"/>
                <circle cx="80" cy="97" r="8" fill="#FFF8F1"/>
              </svg>
            `;
          } else if (type === 'plushie') {
            return `
              <svg viewBox="0 0 160 160" fill="none" style="width: 220px; height: 220px;" aria-hidden="true">
                <circle cx="80" cy="95" r="45" fill="#FBF5F0" stroke="#C78391" stroke-dasharray="4 4" stroke-width="2"/>
                <ellipse cx="64" cy="42" rx="10" ry="26" fill="#E8B7C0" stroke="#C78391" stroke-width="2"/>
                <ellipse cx="96" cy="42" rx="10" ry="26" fill="#E8B7C0" stroke="#C78391" stroke-width="2"/>
                <circle cx="68" cy="88" r="4" fill="#51413C"/>
                <circle cx="92" cy="88" r="4" fill="#51413C"/>
                <path d="M76 98 Q80 104 84 98" stroke="#51413C" stroke-width="2" stroke-linecap="round"/>
              </svg>
            `;
          } else {
            return `
              <svg viewBox="0 0 160 160" fill="none" style="width: 220px; height: 220px;" aria-hidden="true">
                <rect x="55" y="30" width="50" height="95" rx="6" fill="#F2EBE5" stroke="#C78391" stroke-dasharray="4 4" stroke-width="2"/>
                <circle cx="80" cy="60" r="14" fill="#E8B7C0" stroke="#C78391" stroke-width="2"/>
                <line x1="80" y1="74" x2="80" y2="105" stroke="#A9B6A0" stroke-width="3"/>
                <path d="M80 125 L80 145" stroke="#C78391" stroke-width="3" stroke-linecap="round"/>
              </svg>
            `;
          }
        }

        const isMadeToOrder = Boolean(product.madeToOrder || product.made_to_order);
        const stock = (product.stock !== undefined && product.stock !== null) ? parseInt(product.stock, 10) : 0;
        const isOutOfStock = Boolean(product.isSoldOut || product.sold_out || (!isMadeToOrder && stock <= 0));
        const isLowStock = !isOutOfStock && !isMadeToOrder && stock > 0 && stock <= 3;

        const whatsappText = isOutOfStock
          ? encodeURIComponent(`Hi Bhumika! I saw that "${product.name}" on Swan Studio is currently sold out. Could you let me know if it can be crafted for me or when it will be restocked?`)
          : encodeURIComponent(`Hi Bhumika! I'm interested in the "${product.name}" from Swan Studio. Could you share more details?`);
        const waBase = (typeof SITE !== 'undefined' && SITE.whatsappUrl)
          ? SITE.whatsappUrl
          : ((typeof window !== 'undefined' && window.SITE && window.SITE.whatsappUrl)
              ? window.SITE.whatsappUrl
              : 'https://wa.me/919509966512');
        const whatsappUrl = `${waBase}?text=${whatsappText}`;

        // Parse variant / color choices safely (supports strings or objects)
        const rawOptions = (Array.isArray(product.variants) && product.variants.length > 0)
          ? product.variants
          : (Array.isArray(product.colors) && product.colors.length > 0 ? product.colors : []);

        const variantList = rawOptions.map(v => {
          if (typeof v === 'string') {
            const isSold = v.includes('(Sold out)');
            return {
              name: v.replace('(Sold out)', '').trim(),
              inStock: !isSold
            };
          }
          const name = (v && (v.name || v.label || v.title)) ? String(v.name || v.label || v.title) : 'Standard';
          const isSold = Boolean(v && (v.inStock === false || name.includes('(Sold out)')));
          return {
            name: name.replace('(Sold out)', '').trim(),
            inStock: !isSold
          };
        });

        // Render Product Layout
        container.innerHTML = `
          <!-- Left: Image / Visual Gallery -->
          <div class="product-gallery-card">
            <div class="product-main-view" style="overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 280px; background: #FFF6F0; border-radius: var(--radius-md);">
              ${product.imageUrl ? `<img src="${product.imageUrl}" alt="${product.name}" style="width: 100%; height: 100%; max-height: 400px; object-fit: contain; border-radius: var(--radius-sm); ${isOutOfStock ? 'opacity: 0.85;' : ''}">` : getMainVisualSvg(product.iconType)}
            </div>
            ${Array.isArray(product.gallery) && product.gallery.length > 1 ? `
            <div style="display: flex; gap: 0.75rem; margin-top: 1rem; justify-content: center; overflow-x: auto; padding-bottom: 0.25rem;">
              ${product.gallery.map((img, i) => `
                <button type="button" class="gallery-thumb-btn" onclick="document.querySelector('.product-main-view img').src='${img}'" style="width: 60px; height: 60px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); background: var(--white); overflow: hidden; padding: 0; cursor: pointer;">
                  <img src="${img}" alt="Thumbnail ${i + 1}" style="width: 100%; height: 100%; object-fit: cover;">
                </button>
              `).join('')}
            </div>
            ` : ''}
            <p style="text-align: center; font-size: 0.78rem; color: #8A7670; margin-top: 0.75rem;">
              Handcrafted with care by Bhumika Nama in Jaipur.
            </p>
          </div>

          <!-- Right: Information, Specifications & Actions -->
          <div>
            <div class="product-meta-badge">
              <span class="product-tag" style="position: static; display: inline-block; padding: 0.2rem 0.6rem; font-size: 0.76rem; border-radius: var(--radius-pill);">${product.badge || 'Handcrafted in Jaipur'}</span>
              <span>•</span>
              <span>${product.categoryName || 'Creation'}</span>
            </div>

            <h1 class="product-detail-title">${product.name}</h1>

            <div class="product-detail-price">
              <span class="current-price" style="${isOutOfStock ? 'color: #8A7670;' : ''}">₹${(Number(product.price) || 0).toLocaleString('en-IN')}</span>
              ${product.salePrice ? `<span class="original-price">₹${Number(product.salePrice).toLocaleString('en-IN')}</span>` : ''}
            </div>

            <!-- Minimal Plain Text Sold Out or Low Stock Status -->
            ${isOutOfStock ? `<div class="sold-out-text" aria-label="Sold out">Sold out</div>` : ''}
            ${isLowStock ? `<div class="low-stock-text">Only ${stock} left</div>` : ''}

            <p style="font-size: 1.05rem; line-height: 1.7; color: var(--cocoa); margin: 1.25rem 0;">
              ${product.description || 'Artisanal handcrafted creation made with patience and care.'}
            </p>

            <!-- Specifications -->
            <ul class="product-specs-list">
              <li>
                <strong>Materials:</strong>
                <span>${product.materials || 'Soft milk cotton yarn, flexible wire stem'}</span>
              </li>
              <li>
                <strong>Dimensions:</strong>
                <span>${product.dimensions || 'Handcrafted standard sizing (custom sizing available)'}</span>
              </li>
              <li>
                <strong>Prep Time:</strong>
                <span>${product.prepTime || '4–7 business days'}</span>
              </li>
              ${variantList.length > 0 ? `
              <li>
                <strong>Available Colors / Styles:</strong>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.35rem;">
                  ${variantList.map(v => {
                    const isVarSoldOut = isOutOfStock || !v.inStock;
                    return `
                      <span class="variant-option ${isVarSoldOut ? 'variant-option-soldout' : ''}" style="font-size: 0.84rem; padding: 0.25rem 0.65rem; border-radius: var(--radius-pill); border: 1px solid ${isVarSoldOut ? 'rgba(115, 97, 90, 0.2)' : 'var(--rose)'}; ${isVarSoldOut ? 'color: #8A7670; background: #FAF7F5;' : 'color: var(--cocoa); background: #FFF;'}" ${isVarSoldOut ? 'aria-disabled="true"' : ''}>
                        ${isVarSoldOut ? `<s>${v.name}</s> <small style="color: #73615A; font-weight: 600;">(Sold out)</small>` : v.name}
                      </span>
                    `;
                  }).join('')}
                </div>
              </li>
              ` : `
              <li>
                <strong>Available Colors:</strong>
                <span>Handcrafted as pictured (custom variations available upon request)</span>
              </li>
              `}
              <li>
                <strong>Care Note:</strong>
                <span>Gentle cold hand-wash only. Dry flat in shade. Do not tumble dry.</span>
              </li>
            </ul>

            <!-- Single Action Area: Quiet WhatsApp Notify Button for Sold Out, or Add to Bag for In Stock -->
            ${isOutOfStock ? `
              <div style="margin-top: 1.5rem;">
                <a href="${whatsappUrl}" target="_blank" rel="noopener noreferrer" class="btn-notify-outline" style="min-height: 48px; font-size: 0.95rem; width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;" aria-label="Ask about restock on WhatsApp for ${product.name}">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                  <span>Ask on WhatsApp about restock &rarr;</span>
                </a>
              </div>
            ` : `
              <div class="product-purchase-box">
                <div class="qty-selector" aria-label="Select quantity">
                  <button class="qty-btn" id="qty-minus" aria-label="Decrease quantity">-</button>
                  <input type="text" id="qty-input" class="qty-input" value="1" readonly aria-label="Item quantity">
                  <button class="qty-btn" id="qty-plus" aria-label="Increase quantity">+</button>
                </div>

                <button id="add-to-cart-btn" class="btn btn-primary" style="flex: 1; min-width: 180px; min-height: 44px;">
                  Add to Bag
                </button>
              </div>

              <!-- Direct WhatsApp Order Inquiry -->
              <div style="margin-top: 1rem;">
                <a href="${whatsappUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-outline" style="width: 100%; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                  <span>Inquire / Customize on WhatsApp</span>
                </a>
              </div>
            `}

            <p id="cart-feedback-msg" style="margin-top: 0.75rem; font-size: 0.85rem; color: var(--rose-text); font-weight: 500; text-align: center; display: none;">
              ✓ Added to your Bag!
            </p>

            <!-- Customization Callout -->
            <div style="margin-top: 1.5rem; padding: 1rem; background: #FFF4F6; border-radius: var(--radius-sm); border-left: 3px solid var(--rose); font-size: 0.88rem;">
              <strong>Want a custom variation?</strong> Need a different color palette, size, or a personalized name tag? We love custom creations! <a href="custom-order.html" style="color: var(--rose-text); text-decoration: underline; font-weight: 600;">Submit a custom order request here</a>.
            </div>
          </div>
        `;

        // Mobile Sticky Bottom Bar (Part 3 Item 5)
        const oldSticky = document.getElementById('product-mobile-sticky-bar');
        if (oldSticky) oldSticky.remove();

        const stickyBar = document.createElement('div');
        stickyBar.className = 'product-mobile-sticky-bar';
        stickyBar.id = 'product-mobile-sticky-bar';
        stickyBar.innerHTML = `
          <div class="sticky-bar-info">
            <span class="sticky-bar-label">Total</span>
            <span class="sticky-bar-price">₹${(Number(product.price) || 0).toLocaleString('en-IN')}</span>
          </div>
          <div class="sticky-bar-cta" style="display: flex; gap: 0.5rem; align-items: center;">
            <a href="${whatsappUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-outline" style="min-height: 42px; padding: 0.45rem 0.75rem; font-size: 0.8rem; border-color: var(--rose); color: var(--rose-text); display: inline-flex; align-items: center; gap: 4px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2Z"/></svg>
              <span>Enquire</span>
            </a>
            ${isOutOfStock ? `
              <span class="sold-out-text" style="font-size: 0.82rem; font-weight: 600;">Sold out</span>
            ` : `
              <button type="button" class="btn btn-primary" id="mobile-sticky-add-btn" style="min-height: 42px; padding: 0.45rem 1rem; font-size: 0.85rem;">
                Add to Bag
              </button>
            `}
          </div>
        `;
        document.body.appendChild(stickyBar);

        // Elevate dock above mobile sticky bar
        const dock = document.getElementById('swan-action-dock');
        if (dock) dock.classList.add('dock-product-elevated');

        // Quantity selector interactions (in-stock only)
        const qtyMinus = document.getElementById('qty-minus');
        const qtyPlus = document.getElementById('qty-plus');
        const qtyInput = document.getElementById('qty-input');
        const addToCartBtn = document.getElementById('add-to-cart-btn');
        const feedbackMsg = document.getElementById('cart-feedback-msg');
        const mobileStickyAdd = document.getElementById('mobile-sticky-add-btn');

        if (mobileStickyAdd && addToCartBtn) {
          mobileStickyAdd.addEventListener('click', () => {
            addToCartBtn.click();
            mobileStickyAdd.textContent = '✓ Added!';
            setTimeout(() => { mobileStickyAdd.textContent = 'Add to Bag'; }, 1600);
          });
        }

        if (!isOutOfStock && qtyMinus && qtyPlus && qtyInput) {
          qtyMinus.addEventListener('click', () => {
            let val = parseInt(qtyInput.value, 10) || 1;
            if (val > 1) qtyInput.value = val - 1;
          });

          qtyPlus.addEventListener('click', () => {
            let val = parseInt(qtyInput.value, 10) || 1;
            const maxQty = isMadeToOrder ? 10 : Math.max(1, Math.min(10, stock || 10));
            if (val < maxQty) qtyInput.value = val + 1;
          });
        }

        // Add to Cart handler (in-stock only)
        if (addToCartBtn) {
          addToCartBtn.addEventListener('click', () => {
            if (isOutOfStock || (!isMadeToOrder && stock <= 0)) {
              alert('Sorry, this creation is currently sold out and cannot be added to your bag.');
              return;
            }

            const qty = parseInt(qtyInput.value, 10) || 1;
            try {
              const raw = localStorage.getItem('swan_cart');
              let cart = raw ? JSON.parse(raw) : [];
              if (!Array.isArray(cart)) cart = [];

              const existingIndex = cart.findIndex(item => item.id === product.id);
              if (existingIndex > -1) {
                cart[existingIndex].quantity = (cart[existingIndex].quantity || 1) + qty;
                if (!cart[existingIndex].image && (product.imageUrl || product.image_url)) {
                  cart[existingIndex].image = product.imageUrl || product.image_url;
                }
              } else {
                cart.push({
                  id: product.id,
                  slug: product.slug,
                  name: product.name,
                  price: product.price,
                  image: product.imageUrl || product.image_url || 'assets/images/hero-bouquet.webp',
                  quantity: qty
                });
              }
              localStorage.setItem('swan_cart', JSON.stringify(cart));

              // Update header bag count badge
              const bagCountEl = document.getElementById('bag-count');
              if (bagCountEl) {
                const total = cart.reduce((acc, it) => acc + (it.quantity || 0), 0);
                bagCountEl.textContent = total;
                bagCountEl.setAttribute('aria-label', `${total} items in bag`);
              }

              // Instantly refresh fixed mobile billing notification bar
              if (typeof updateMobileBillingBar === 'function') {
                updateMobileBillingBar();
              }

              feedbackMsg.style.display = 'block';
              feedbackMsg.textContent = `✓ Added ${qty} × "${product.name}" to your Bag!`;
              setTimeout(() => {
                feedbackMsg.style.display = 'none';
              }, 3500);
            } catch (e) {
              console.error(e);
            }
          });
        }

        // Load Reviews on this specific creation
        try {
          const revContainer = document.getElementById('product-reviews-container');
          if (revContainer && typeof fetchApprovedReviews === 'function') {
            const revRes = await fetchApprovedReviews(product.id);
            const allReviews = (revRes && revRes.data) ? revRes.data : [];
            const productReviews = allReviews.filter(r => r.productId === product.id);

            const safeEscape = window.escapeSwanHtml || function (s) {
              return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            };
            const safeDate = window.formatSwanDate || function (d) {
              try { return new Date(d).toLocaleDateString('en-IN', { month: 'short', year: 'numeric' }); } catch (e) { return ''; }
            };
            const safeStars = window.renderSwanStars || function (r) {
              return '★★★★★';
            };

            if (productReviews.length === 0) {
              revContainer.innerHTML = `
                <div class="product-empty-reviews" style="background: #FFFFFF; border: 1.5px dashed rgba(199, 131, 145, 0.35); border-radius: 20px; padding: 2.25rem 1.5rem; text-align: center; max-width: 520px; margin: 0 auto; box-shadow: 0 4px 18px rgba(74, 53, 47, 0.04);">
                  <div style="width: 48px; height: 48px; margin: 0 auto 0.85rem auto; display: flex; align-items: center; justify-content: center; background: #FFF0F3; border-radius: 50%; color: var(--rose-text); font-size: 1.35rem;">
                    🌸
                  </div>
                  <h3 style="font-family: var(--font-serif); font-size: 1.35rem; color: var(--cocoa); margin-bottom: 0.35rem;">
                    Be the first to share an unboxing note
                  </h3>
                  <p style="font-size: 0.9rem; color: #7A6962; line-height: 1.55; margin-bottom: 1.25rem;">
                    Received this handcrafted piece? Share what made you smile when opening your parcel — Bhumika reads every note personally.
                  </p>
                  <button type="button" class="btn btn-primary open-note-modal-btn" style="min-height: 46px; padding: 0.65rem 1.4rem; border-radius: 999px;">
                    Leave a note for this piece
                  </button>
                </div>
              `;
            } else {
              const isSingle = productReviews.length === 1;
              revContainer.innerHTML = `
                <div class="reviews-cards-grid ${isSingle ? 'single-review-grid' : ''}" style="${isSingle ? 'max-width: 580px; margin: 0 auto;' : ''}">
                  ${productReviews.map(r => {
                    const rating = Math.min(5, Math.max(1, parseInt(r.rating, 10) || 5));
                    const authorName = (r.displayName || r.display_name || r.customer_name || r.author_name || r.authorName || r.name || 'Kind Customer').trim();
                    const initial = (authorName[0] || 'K').toUpperCase();
                    const bodyText = r.body || r.comment || 'Loved this handmade piece!';
                    const dateStr = safeDate(r.createdAt || r.created_at);
                    const cityStr = r.city || r.author_city || 'Verified Customer';
                    return `
                      <article class="home-review-card artisan-review-card">
                        <div class="card-inner-content">
                          <div class="review-card-header">
                            <div class="review-author-wrap">
                              <div class="review-avatar" aria-hidden="true">${safeEscape(initial)}</div>
                              <div class="review-author-details">
                                <div class="review-author-name-row">
                                  <span class="home-review-author">${safeEscape(authorName)}</span>
                                  ${r.verifiedBuyer ? `
                                    <span class="verified-buyer-badge" title="Verified buyer">
                                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                      Verified
                                    </span>
                                  ` : ''}
                                </div>
                                <span class="home-review-location">
                                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                  ${safeEscape(cityStr)}
                                </span>
                              </div>
                            </div>
                            <div class="review-rating-pill" aria-label="${rating} out of 5 stars">
                              <span class="rating-pill-num">${rating}.0</span>
                              <div class="rating-stars-inline home-review-stars">${safeStars(rating, 14)}</div>
                            </div>
                          </div>

                          <div class="review-quote-wrap">
                            <svg class="review-quote-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                              <path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"/>
                            </svg>
                            <p class="home-review-body">
                              ${safeEscape(bodyText)}
                            </p>
                          </div>

                          ${r.photoUrl ? `
                            <div style="margin-bottom: 0.85rem;">
                              <img src="${safeEscape(r.photoUrl)}" alt="Customer photo by ${safeEscape(authorName)}" loading="lazy" style="width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1.5px solid rgba(199, 131, 145, 0.3);">
                            </div>
                          ` : ''}

                          ${r.adminReply ? `
                            <div class="admin-reply-box" style="margin-top: 0.75rem;">
                              <div class="admin-reply-header">Reply from Bhumika:</div>
                              <p class="admin-reply-text">${safeEscape(r.adminReply)}</p>
                            </div>
                          ` : ''}
                        </div>

                        <div class="home-review-meta">
                          <span class="product-chip-link"><span>🌸</span> ${safeEscape(product.name)}</span>
                          <time datetime="${safeEscape(r.createdAt || '')}" class="home-review-date">
                            ${dateStr}
                          </time>
                        </div>
                      </article>
                    `;
                  }).join('')}
                </div>
                <div style="text-align: center; margin-top: 1.5rem;">
                  <button type="button" class="btn btn-primary open-note-modal-btn" style="min-height: 46px; padding: 0.65rem 1.4rem; border-radius: 999px;">
                    Leave a note for this piece
                  </button>
                </div>
              `;
            }
          }
        } catch (revErr) {
          console.warn('Failed to load reflections for product:', revErr);
        }

        // Render Related Products (Excluding current)
        try {
          const allResult = await fetchProducts();
          const allProducts = allResult.data || [];
          const related = allProducts.filter(p => p.slug !== product.slug).slice(0, 4);

          if (relatedGrid) {
            if (related.length === 0) {
              relatedGrid.innerHTML = `
                <p style="grid-column: 1 / -1; text-align: center; color: #8A7670; padding: 1.5rem;">
                  Explore our full collection in the <a href="shop.html" style="color: var(--rose-text); text-decoration: underline;">Shop</a>.
                </p>
              `;
            } else {
              relatedGrid.innerHTML = related.map(p => {
                const isRelMto = Boolean(p.madeToOrder || p.made_to_order);
                const relStock = (p.stock !== undefined && p.stock !== null) ? Number(p.stock) : 0;
                const isRelSoldOut = Boolean(p.isSoldOut || p.sold_out || (!isRelMto && relStock <= 0));
                const isRelLowStock = !isRelSoldOut && !isRelMto && relStock > 0 && relStock <= 3;

                return `
                  <article class="product-card ${isRelSoldOut ? 'is-sold-out' : ''}">
                    <div class="product-thumb" style="overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative;">
                      ${isRelSoldOut 
                        ? `<span class="sold-out-pill" aria-label="Sold out">Sold out</span>`
                        : (!isRelMto && p.badge ? `<span class="product-tag">${p.badge}</span>` : '')
                      }
                      ${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}" style="width: 100%; height: 100%; object-fit: cover;">` : getMainVisualSvg(p.iconType)}
                    </div>
                    <div class="product-info">
                      <span class="product-category">${p.categoryName || 'Crochet Creation'}</span>
                      <h3 class="product-name" title="${p.name}">${p.name}</h3>
                      <div class="product-price-row">
                        <span class="product-price">₹${(Number(p.price) || 0).toLocaleString('en-IN')}</span>
                      </div>
                      ${isRelLowStock ? `<span class="low-stock-text">Only ${relStock} left</span>` : ''}
                      <div class="product-actions" style="margin-top: 0.65rem;">
                        ${isRelSoldOut 
                          ? `<a href="product.html?slug=${p.slug}" class="btn-notify-outline" aria-label="Notify me when ${p.name} is restocked">Notify me</a>`
                          : `<a href="product.html?slug=${p.slug}" class="btn btn-outline btn-sm" style="width: 100%; min-height: 44px; display: inline-flex; align-items: center; justify-content: center;">View Details</a>`
                        }
                      </div>
                    </div>
                  </article>
                `;
              }).join('');
            }
          }
        } catch (relErr) {
          console.warn('Failed to load related creations:', relErr);
        }

      } catch (err) {
        console.error('Failed to load creation details:', err);
        if (container) {
          container.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1; text-align: center; padding: 4rem 1.5rem;">
              <div class="empty-state-icon" style="font-size: 3.5rem; margin-bottom: 1rem;">🧶</div>
              <h2 style="font-size: 1.85rem; margin-bottom: 0.5rem; color: var(--cocoa);">Unable to load creation</h2>
              <p style="color: #73615A; max-width: 500px; margin: 0 auto 1.5rem auto; line-height: 1.6;">
                We encountered an unexpected error while loading this handcrafted piece. Please try refreshing the page or exploring our catalog.
              </p>
              <a href="shop.html" class="btn btn-primary">Browse Available Creations</a>
            </div>
          `;
        }
      }
    });
  </script>
</body>
</html>
