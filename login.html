<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Swan Studio | Customer Account</title>
  <meta name="description" content="Sign in to your Swan Studio customer account to track your orders, view saved custom creations, and manage your delivery details.">
  <meta name="robots" content="noindex, nofollow">
  
  <!-- Google Fonts: Cormorant Garamond & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Skip Link for Accessibility -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Global Header (Injected by js/main.js) -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main id="main" class="section section-cream" style="min-height: 80vh; display: flex; align-items: center;">
    <div class="container" style="max-width: 480px; width: 100%;">

      <!-- Section Header -->
      <div class="section-header" style="margin-bottom: var(--space-xl); text-align: center;">
        <h1 class="section-title" id="login-title" style="font-size: clamp(1.85rem, 4vw, 2.3rem);">Welcome Back</h1>
        <p class="section-subtitle" id="login-subtitle">
          Sign in to view your orders, payment verification status, and saved details.
        </p>
      </div>

      <!-- Context Alert / Security Notice -->
      <div id="auth-alert" style="display: none; margin-bottom: 1.25rem; padding: 0.85rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; line-height: 1.5;"></div>

      <!-- Login Card -->
      <div class="auth-card">
        
        <!-- Customer vs Admin Atelier Mode Switcher -->
        <div class="auth-role-tabs" role="tablist">
          <button type="button" class="auth-role-tab active" id="tab-cust-mode" role="tab" aria-selected="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Customer Sign In</span>
          </button>
          <button type="button" class="auth-role-tab" id="tab-admin-mode" role="tab" aria-selected="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <span>Admin Atelier</span>
          </button>
        </div>

        <form id="login-form" novalidate>
          <!-- Email / Admin ID Input -->
          <div class="form-group">
            <label for="login-email" class="form-label" id="login-id-label">Email Address</label>
            <input 
              type="text" 
              id="login-email" 
              class="form-control" 
              placeholder="you@example.com" 
              autocomplete="username"
              required
            >
          </div>

          <!-- Password Input -->
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
              <label for="login-password" class="form-label" style="margin: 0;">Password</label>
              <a href="#" id="forgot-password-link" style="font-size: 0.8rem; color: var(--rose-text); text-decoration: underline;">
                Forgot password?
              </a>
            </div>
            <input 
              type="password" 
              id="login-password" 
              class="form-control" 
              placeholder="Enter your password" 
              autocomplete="current-password"
              required
            >
          </div>

          <!-- Helper hint -->
          <div id="login-hint-text" style="font-size: 0.78rem; color: #8A7670; margin-bottom: 0.85rem;">
            ✨ Customers: Use your registered email & password.
          </div>

          <!-- Sign In Button -->
          <button type="submit" id="login-submit-btn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-weight: 600;">
            Sign In to Customer Account
          </button>
        </form>

        <!-- Feedback / Status Area -->
        <div id="login-feedback" style="display: none; margin-top: 1rem; padding: 0.85rem; border-radius: var(--radius-sm); font-size: 0.85rem; text-align: center;"></div>

        <!-- Footer Card Link to Sign Up -->
        <div id="signup-prompt-row" style="text-align: center; margin-top: 1.5rem; padding-top: 1.15rem; border-top: 1px solid var(--border-subtle); font-size: 0.88rem;">
          <p style="color: #73615A; margin: 0;">
            New to Swan Studio? 
            <a href="signup.html" style="color: var(--rose-text); font-weight: 600; text-decoration: underline;">
              Create customer account
            </a>
          </p>
        </div>

      </div>

    </div>
  </main>

  <!-- Global Footer (Injected by js/main.js) -->
  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/api-config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('login-submit-btn');
      const feedback = document.getElementById('login-feedback');
      const alertBox = document.getElementById('auth-alert');
      const forgotLink = document.getElementById('forgot-password-link');
      const tabCust = document.getElementById('tab-cust-mode');
      const tabAdmin = document.getElementById('tab-admin-mode');
      const idInput = document.getElementById('login-email');
      const idLabel = document.getElementById('login-id-label');
      const hintText = document.getElementById('login-hint-text');
      const signupRow = document.getElementById('signup-prompt-row');
      const pageTitle = document.getElementById('login-title');
      const pageSubtitle = document.getElementById('login-subtitle');

      let currentMode = 'customer'; // 'customer' or 'admin'

      function setMode(mode) {
        currentMode = mode;
        if (mode === 'admin') {
          tabAdmin.classList.add('active');
          tabAdmin.setAttribute('aria-selected', 'true');
          tabCust.classList.remove('active');
          tabCust.setAttribute('aria-selected', 'false');

          pageTitle.textContent = 'Admin Atelier';
          pageSubtitle.textContent = 'Enter verified administrator credentials for Swan Studio.';
          idLabel.textContent = 'Admin ID or Email';
          idInput.placeholder = 'admin or swanstudio2604@gmail.com';
          idInput.value = idInput.value || 'swanstudio2604@gmail.com';
          submitBtn.textContent = 'Enter Admin Atelier 👑';
          hintText.textContent = '🔒 Administrator credentials verified against secure atelier access.';
          if (signupRow) signupRow.style.display = 'none';
        } else {
          tabCust.classList.add('active');
          tabCust.setAttribute('aria-selected', 'true');
          tabAdmin.classList.remove('active');
          tabAdmin.setAttribute('aria-selected', 'false');

          pageTitle.textContent = 'Welcome Back';
          pageSubtitle.textContent = 'Sign in to view your orders, payment verification status, and saved details.';
          idLabel.textContent = 'Email Address';
          idInput.placeholder = 'you@example.com';
          submitBtn.textContent = 'Sign In to Customer Account';
          hintText.textContent = '✨ Customers: Use your registered email & password.';
          if (signupRow) signupRow.style.display = 'block';
        }
      }

      if (tabCust) tabCust.addEventListener('click', () => setMode('customer'));
      if (tabAdmin) tabAdmin.addEventListener('click', () => setMode('admin'));

      // Check reason from URL query
      const urlParams = new URLSearchParams(window.location.search);
      const reason = urlParams.get('reason');
      const adminReq = urlParams.get('admin');

      if (reason === 'unauthorized_admin' || adminReq === '1') {
        setMode('admin');
        alertBox.style.display = 'block';
        alertBox.style.background = '#FFF0F2';
        alertBox.style.color = '#9A5565';
        alertBox.style.border = '1.5px solid var(--rose)';
        alertBox.innerHTML = '<strong>Administrator Access:</strong> Please sign in with your verified Admin ID & password to continue.';
      } else if (reason === 'login_required') {
        alertBox.style.display = 'block';
        alertBox.style.background = '#FFF8F1';
        alertBox.style.color = 'var(--cocoa)';
        alertBox.style.border = '1px dashed var(--rose)';
        alertBox.innerHTML = 'Please sign in to view your personal customer account and order history.';
      } else if (reason === 'logged_out') {
        alertBox.style.display = 'block';
        alertBox.style.background = '#F0FDF4';
        alertBox.style.color = '#166534';
        alertBox.style.border = '1.5px solid #86EFAC';
        alertBox.innerHTML = '✓ You have safely signed out of Swan Studio.';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        feedback.style.display = 'none';

        const identifier = idInput.value.trim();
        const password = document.getElementById('login-password').value;

        if (!identifier || !password) {
          showFeedback('Please enter both your identifier and password.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = currentMode === 'admin' ? 'Verifying Admin credentials...' : 'Signing in...';

        try {
          const { profile, isDemo } = await AUTH.signIn({ email: identifier, password });
          
          if (profile && profile.role === 'admin') {
            showFeedback('✓ Admin credentials verified! Opening Atelier Dashboard...', 'success');
            setTimeout(() => {
              window.location.href = 'admin/index.html';
            }, 700);
          } else {
            showFeedback(`✓ Welcome back, ${profile.full_name || 'Customer'}! Loading your account...`, 'success');
            setTimeout(() => {
              const redirect = urlParams.get('redirect') || 'account.html';
              window.location.href = redirect;
            }, 700);
          }

        } catch (err) {
          showFeedback(err.message || 'Invalid credentials. Please try again.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = currentMode === 'admin' ? 'Enter Admin Atelier 👑' : 'Sign In to Customer Account';
        }
      });

      forgotLink.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = idInput.value.trim();
        if (!email) {
          alert('Please enter your email address in the field above first, then click "Forgot password?".');
          return;
        }

        try {
          await AUTH.resetPassword(email);
          alert(`Password reset instructions have been dispatched to ${email}.`);
        } catch (err) {
          alert(err.message || 'Unable to request password reset.');
        }
      });

      function showFeedback(msg, type) {
        feedback.style.display = 'block';
        if (type === 'error') {
          feedback.style.background = '#FFF0F2';
          feedback.style.color = '#9A5565';
          feedback.style.border = '1px solid var(--rose)';
        } else {
          feedback.style.background = '#EBF8F0';
          feedback.style.color = '#1E6B39';
          feedback.style.border = '1px solid #A9D5B7';
        }
        feedback.textContent = msg;
      }
    });
  </script>
</body>
</html>
